[package]
name = "open-dot-runner"
version = "0.3.0"
description = "Open Dot Runner — base local de agentes"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
# Ícones do Runner são arte do Dot (LICENSE-DOT-ASSETS.md). Aplicativo, não biblioteca: nunca publicar no crates.io.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
rand = "0.10"
tar = "0.4"
toml = "=1.1.8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
minisign-verify = "0.3"
base64 = "0.22"
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
minisign = "0.7"
