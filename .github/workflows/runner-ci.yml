name: Runner CI
on:
  pull_request:
    paths: ["apps/runner/**", "apps/web/**", "apps/worker/**", "packages/core/**", "scripts/*runner*", "package*.json", ".github/workflows/runner-*.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run runner:build
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:runner
  native:
    # Opt-in explícito: não habilita cobrança nem consome minutos macOS sem configuração.
    # Nunca em PR de fork: código de terceiros não roda nos runners nativos do projeto.
    if: vars.RUNNER_BUILDS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Sem cache de dependências no job que gera instaladores.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable em 20/10/2026
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run runner:build
      - name: Rust tests
        run: cargo test --locked --manifest-path apps/runner/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer (sem publicação)
        # Sem chave de assinatura no CI (nenhum secret): pacotes do updater desligados neste build.
        # Para habilitar, ver docs/release/runner-chave-de-assinatura.md (decisão do João).
        run: npm run runner:desktop -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Padronizar nome e checksum
        run: node scripts/package-runner.mjs ${{ matrix.target }} ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenDot-Runner-${{ matrix.artifact }}
          path: apps/runner/installers/*
          if-no-files-found: error
          retention-days: 1
  rust-audit:
    # Opt-in: auditoria de vulnerabilidades das crates do Runner (RustSec). Não roda em PR de fork.
    if: vars.RUNNER_BUILDS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable em 20/10/2026
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file apps/runner/src-tauri/Cargo.lock
