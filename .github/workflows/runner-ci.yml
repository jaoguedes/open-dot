name: Runner CI
on:
  pull_request:
    paths: ["apps/runner/**", "apps/web/**", "apps/worker/**", "packages/core/**", "scripts/*runner*", "package*.json", ".github/workflows/runner-*.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run runner:build
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:runner
  native:
    # Opt-in explícito: não habilita cobrança nem consome minutos macOS sem configuração.
    if: vars.RUNNER_BUILDS_ENABLED == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run runner:build
      - name: Rust tests
        run: cargo test --locked --manifest-path apps/runner/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer (sem publicação)
        run: npm run runner:desktop -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign -- --locked
      - name: Padronizar nome e checksum
        run: node scripts/package-runner.mjs ${{ matrix.target }} ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDot-Runner-${{ matrix.artifact }}
          path: apps/runner/installers/*
          if-no-files-found: error
          retention-days: 1
