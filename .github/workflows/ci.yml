# CI do Open Dot: só leitura do repositório, nenhum segredo, nenhum deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Dependências
        run: npm ci
      - name: Varredura de segredos
        run: npm run scan:secrets
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Regressão do resumo do Correio (não é medida real)
        run: npm run eval:correio
      - name: Testes do Blender (sem Blender)
        run: npm run test:blender
      - name: Build (falha acima de 400 KB na primeira tela)
        run: npm run build
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Celular com API simulada (fases A, D com axe, E, F)
        run: |
          npm run ui:fase-a
          npm run ui:fase-d
          npm run ui:fase-e
          npm run ui:fase-f
          npm run ui:fase-g
          npm run ui:rodada4
  without-dot:
    # Prova que o código AGPL compila, testa e gera build sem os arquivos do Dot (licença própria).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: App sem o Dot, com o Marcador
        run: npm run check:without-dot
