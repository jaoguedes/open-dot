# CI do Open Dot: só leitura do repositório, nenhum segredo, nenhum deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependências
        run: npm ci
      - name: Varredura de segredos
        run: npm run scan:secrets
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Testes do Blender (sem Blender)
        run: npm run test:blender
      - name: Build (falha acima de 400 KB na primeira tela)
        run: npm run build
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Celular com API simulada (fases A, D com axe, E, F)
        run: |
          npm run ui:fase-a
          npm run ui:fase-d
          npm run ui:fase-e
          npm run ui:fase-f
