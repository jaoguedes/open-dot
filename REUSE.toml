# Mapa de licenças por caminho (formato REUSE 3.x) para arquivos sem cabeçalho SPDX:
# binários, JSON, migrações já aplicadas e documentos. Não validado com a ferramenta `reuse`
# nesta máquina; a conferência dos cabeçalhos de código é `node scripts/license/spdx.mjs --check`.
version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 João Pedro Guedes"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "apps/web/src/dot/**", "apps/web/src/dot3d/**", "apps/web/src/components/Dot2D.tsx", "apps/web/src/components/Dot3D.tsx",
  "apps/web/src/mascot/dot.ts", "packages/core/src/dot/**", "assets/dot/**", "assets/icones/**", "blender/**",
  "apps/web/public/icons/**", "apps/web/public/favicon.ico", "apps/web/public/sounds/**", "apps/runner/src-tauri/icons/**",
  "scripts/sounds/**", "docs/capturas/**", "docs/referencias/dot_*", "docs/design/v0.3-referencia-runner/**",
  "apps/web/test/dot-art.test.ts", "apps/web/test/dot-v03.test.ts", "apps/web/test/dot3d.test.ts", "apps/web/test/ring.test.ts", "apps/web/test/ticker.test.ts",
  "apps/web/test/icons.test.ts", "packages/core/test/dot.test.ts",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 João Pedro Guedes"
SPDX-License-Identifier = "LicenseRef-OpenDot-Mascot-All-Rights-Reserved"

[[annotations]]
path = ["apps/web/public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "Autores das fontes Inter, Instrument Serif e JetBrains Mono"
SPDX-License-Identifier = "OFL-1.1"
